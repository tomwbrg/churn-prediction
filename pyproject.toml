[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction"
version = "1.0.0"
description = "Churn prediction for a music streaming service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tom Weinberg" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=14.0",
    "joblib>=1.3",
    "streamlit>=1.30",
    "altair>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Le notebook est conservé tel qu'il a été exécuté : c'est la trace de
# l'exploration, pas du code de production à reformater.
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
